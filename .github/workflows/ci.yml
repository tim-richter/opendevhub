name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter opendevhub build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # direct: native Docker on Linux. gateway: the macOS/rootless path.
        route: [direct, gateway]
    env:
      OPENDEVHUB_E2E: "1"
      OPENDEVHUB_ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm i -g @devcontainers/cli
      # The tests check that the host's git identity reaches the container.
      - run: |
          git config --global user.name "opendevhub e2e"
          git config --global user.email "e2e@opendevhub.invalid"
      - run: pnpm test:e2e
