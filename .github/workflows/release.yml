name: Release

# After CI (unit + e2e) passes on main:
# - pending changesets → open/update the "Version Packages" PR
# - no pending changesets (i.e. that PR was just merged) → publish to npm,
#   tag and create a GitHub release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version branch, tags and GitHub releases
  pull-requests: write # open/update the Version Packages PR
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) needs no token. Until it is configured on
      # npmjs.com (it can only be set up once the package exists), set an
      # NPM_TOKEN secret and it is used instead.
      - name: Use NPM_TOKEN when set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
          fi

      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
