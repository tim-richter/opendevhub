<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opendevhub isn't running</title>
    <!-- Served by the service worker when the server doesn't answer, so everything is inline. -->
    <style>
      :root {
        color-scheme: light dark;
        --background: #fcfcfc;
        --foreground: #18181b;
        --muted-foreground: #71717a;
        --card: #f6f6f7;
        --border: #e4e4e7;
        --accent: #3366ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0b0b0d;
          --foreground: #f7f7f7;
          --muted-foreground: #a1a1aa;
          --card: #151517;
          --border: #ffffff17;
          --accent: #6c9bff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--background);
        color: var(--foreground);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
      }
      svg {
        width: 40px;
        height: 40px;
        color: var(--accent);
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted-foreground);
      }
      code {
        display: block;
        margin: 0 0 16px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--foreground);
        font:
          13px/1.5 ui-monospace,
          monospace;
        user-select: all;
        overflow-x: auto;
      }
      button {
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        cursor: pointer;
      }
      #status {
        margin: 12px 0 0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <g
          stroke="currentColor"
          stroke-width="7"
          fill="none"
          stroke-linejoin="round"
          stroke-linecap="round"
        >
          <polygon points="50,10 84.64,30 84.64,70 50,90 15.36,70 15.36,30" />
          <circle cx="50" cy="50" r="15" />
          <line x1="50" y1="10" x2="50" y2="35" />
          <line x1="84.64" y1="30" x2="62.99" y2="42.5" />
          <line x1="84.64" y1="70" x2="62.99" y2="57.5" />
          <line x1="50" y1="90" x2="50" y2="65" />
          <line x1="15.36" y1="70" x2="37.01" y2="57.5" />
          <line x1="15.36" y1="30" x2="37.01" y2="42.5" />
        </g>
      </svg>
      <h1>opendevhub isn't running</h1>
      <p>Start it in a terminal:</p>
      <code>opendevhub</code>
      <p>Or have it start at login, so this window always works:</p>
      <code>opendevhub service install</code>
      <button type="button" id="retry">Try again</button>
      <p id="status" role="status">
        This page reloads by itself once the server is back.
      </p>
    </main>
    <script>
      const POLL_MS = 3000;
      const status = document.querySelector("#status");
      const check = async () => {
        try {
          const res = await fetch("/api/health", { cache: "no-store" });
          if (res.ok) {
            location.reload();
            return true;
          }
        } catch {
          // Still down.
        }
        return false;
      };
      document.querySelector("#retry").addEventListener("click", async () => {
        if (!(await check())) {
          status.textContent = "Still not answering. Is opendevhub running?";
        }
      });
      setInterval(check, POLL_MS);
    </script>
  </body>
</html>
